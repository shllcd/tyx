name: Release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: version
        uses: shllcd/actions/prepare-release@2646c40361e38224059283a1d1073a8d4b3d6cb9 # v1.1.0
        with:
          source: changelog
          write-manifest: true
          write-changelog: true
          require-default-branch: true
          version-files: 'packages/tyxrs/package.json:^  "version": "([^"]*)"'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12

      - name: Build npm package
        working-directory: packages/tyxrs
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - uses: shllcd/actions/publish-crates@2646c40361e38224059283a1d1073a8d4b3d6cb9 # v1.1.0
        with:
          version: ${{ steps.version.outputs.version }}
          packages: tyx-derive, tyx-ir, tyx
          args: --locked --allow-dirty

      - uses: shllcd/actions/publish-npm@2646c40361e38224059283a1d1073a8d4b3d6cb9 # v1.1.0
        with:
          path: packages/tyxrs
          version: ${{ steps.version.outputs.version }}
          manager: npm

      - uses: shllcd/actions/publish-release@2646c40361e38224059283a1d1073a8d4b3d6cb9 # v1.1.0
        with:
          tag: ${{ steps.version.outputs.tag }}
          notes: ${{ steps.version.outputs.notes }}
          files: ''
