name: Release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Require default branch
        if: github.ref_name != github.event.repository.default_branch
        run: |
          echo "::error::Releases run from ${{ github.event.repository.default_branch }} only"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Bump version and changelog
        id: version
        env:
          NOTES_FILE: ${{ runner.temp }}/notes.md
        run: |
          version=$(node .github/scripts/release.mjs)
          cargo metadata --format-version 1 > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for crate in tyx-derive tyx-ir tyx; do
            if curl -sf "https://crates.io/api/v1/crates/$crate/$VERSION" > /dev/null; then
              echo "$crate $VERSION is already published"
              continue
            fi
            for attempt in $(seq 10); do
              if cargo publish -p "$crate"; then break; fi
              if [ "$attempt" = 10 ]; then echo "publishing $crate failed" >&2; exit 1; fi
              sleep 20
            done
          done

      - name: Commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "release: v$VERSION"
          git tag "v$VERSION"
          git push origin "HEAD:${{ github.event.repository.default_branch }}" --tags

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --title "v$VERSION" --notes-file "${{ runner.temp }}/notes.md"
