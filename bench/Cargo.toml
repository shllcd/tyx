[package]
name = "tyx-bench"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[profile.release]
codegen-units = 1
lto = "fat"
debug = 1

[dependencies]
bincode = { version = "2", features = ["serde"] }
bitcode = { version = "0.6.9", features = ["serde", "time", "uuid"] }
capnp = "0.27.2"
ciborium = "0.2.2"
flatbuffers = "25.12.19"
tyx = { path = "../crates/tyx", default-features = false, features = ["time", "uuid"] }
postcard = { version = "1.1.3", features = ["alloc"] }
pot = "3.0.1"
prost = "0.14.4"
rkyv = { version = "0.8.18", features = ["uuid-1"] }
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = "0.3.55"
uuid = { version = "1.28.0", features = ["serde"] }
zstd = "0.14.3"

[build-dependencies]
capnpc = "0.27.0"
