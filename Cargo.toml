[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = true
license = "MIT"
repository = "https://github.com/shllcd/tyx"

[workspace.dependencies]
inventory = "0.3"
tyx = { path = "crates/tyx" }
tyx-derive = { path = "crates/tyx-derive" }
tyx-ir = { path = "crates/tyx-ir" }
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
time = "0.3"
uuid = "1"

[profile.dev]
debug = false
